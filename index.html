<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form | NeuroNexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <div class="header">
            <h1>NeuroNexus Application</h1>
            <p>Please complete the form below to apply for our position. All fields marked with an asterisk (*) are required.</p>
        </div>

        <div class="form-container">
            <form>
                <div class="section-title">
                    <i class="fas fa-user me-2"></i>Personal Information
                </div>
                
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label for="fullName" class="form-label required-field">Full Name</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Enter your full name" required>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="phoneNumber" class="form-label required-field">Contact Number</label>
                        <div class="input-with-icon">
                            <i class="fas fa-phone input-icon"></i>
                            <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" placeholder="Enter your phone number" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="dob" class="form-label required-field">Date of Birth</label>
                        <div class="input-with-icon">
                            <i class="fas fa-calendar input-icon"></i>
                            <input type="date" id="dob" name="dob" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-12">
                        <label for="email" class="form-label required-field">Email Address</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required>
                        </div>
                        <div class="form-text">We'll never share your email with anyone else.</div>
                    </div>
                    
                    <div class="col-12">
                        <label for="address" class="form-label required-field">Address</label>
                        <textarea id="address" name="address" rows="3" class="form-control" placeholder="Enter your full address" required></textarea>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label required-field">Gender</label>
                        <div class="d-flex gap-4 mt-2">
                            <div class="form-check">
                                <input type="radio" id="male" name="gender" value="male" class="form-check-input" required>
                                <label for="male" class="form-check-label">Male</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" id="female" name="gender" value="female" class="form-check-input">
                                <label for="female" class="form-check-label">Female</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" id="preferNot" name="gender" value="prefer not to say" class="form-check-input">
                                <label for="preferNot" class="form-check-label">Prefer not to say</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-title">
                    <i class="fas fa-building me-2"></i>Company Information
                </div>
                
                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="companyName" class="form-label required-field">Company Name</label>
                        <div class="input-with-icon">
                            <i class="fas fa-building input-icon"></i>
                            <input type="text" id="companyName" name="companyName" class="form-control" placeholder="Enter your company name" required>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="department" class="form-label required-field">Department</label>
                        <select id="department" name="department" class="form-select" required>
                            <option value="" selected disabled>Select your department</option>
                            <option value="HR">Human Resources</option>
                            <option value="Sales">Sales</option>
                            <option value="Development">Development</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="linkedin" class="form-label">LinkedIn Profile</label>
                        <div class="input-with-icon">
                            <i class="fab fa-linkedin input-icon"></i>
                            <input type="url" id="linkedin" name="linkedin" class="form-control" placeholder="https://linkedin.com/in/yourname">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="resume" class="form-label">Upload Resume (PDF)</label>
                        <div class="input-with-icon">
                            <i class="fas fa-file-upload input-icon"></i>
                            <input type="file" id="resume" name="resume" class="form-control" accept=".pdf">
                        </div>
                    </div>
                    
                    
                </div>

                <div class="form-footer">
                    <button type="reset" class="btn btn-secondary">
                        <i class="fas fa-undo me-2"></i>Reset
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane me-2"></i>Submit Application
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
